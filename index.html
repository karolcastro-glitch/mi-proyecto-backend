<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Sistema de Gestión de Reservas</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="bg-slate-50 min-h-screen font-sans text-slate-800 antialiased">

    <div class="max-w-6xl mx-auto px-4 py-8">
        <header class="flex flex-col md:flex-row items-center justify-between mb-8 border-b border-slate-200 pb-5 gap-4">
            <div class="flex items-center gap-3">
                <div class="bg-indigo-600 text-white p-3 rounded-xl shadow-md shadow-indigo-100">
                    <i class="fa-solid fa-utensils text-xl"></i>
                </div>
                <div>
                    <h1 class="text-2xl font-bold text-slate-900 tracking-tight">GourmetReserve</h1>
                    <p class="text-sm text-slate-500">Administración de Base de Datos • Unicomfacauca</p>
                </div>
            </div>
            <span class="inline-flex items-center gap-1.5 py-1.5 px-3 rounded-full text-xs font-medium bg-emerald-50 text-emerald-700 border border-emerald-200">
                <span class="h-2 w-2 rounded-full bg-emerald-500 animate-pulse"></span> Sistema Operativo
            </span>
        </header>

        <section class="mb-12">
            <div class="flex items-center gap-2 mb-4">
                <h2 class="text-xs font-bold text-slate-400 uppercase tracking-widest">Módulo de Distribución (Mesas)</h2>
                <div class="h-0.5 bg-slate-200 flex-1"></div>
            </div>
            
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                    <h3 class="font-semibold text-sm mb-4 text-slate-700 flex items-center gap-2">
                        <i class="fa-solid fa-plus text-indigo-600"></i> Configurar Nueva Mesa
                    </h3>
                    <form id="formMesa" class="space-y-3">
                        <div>
                            <label class="block text-xs font-medium text-slate-500 mb-1">Número de Mesa</label>
                            <input type="number" id="numMesa" required class="w-full px-3 py-2 border border-slate-200 bg-slate-50 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-600 focus:outline-none transition-all">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-slate-500 mb-1">Capacidad (Asientos)</label>
                            <input type="number" id="capacidadMesa" required class="w-full px-3 py-2 border border-slate-200 bg-slate-50 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-600 focus:outline-none transition-all">
                        </div>
                        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold py-2.5 rounded-lg transition-all cursor-pointer shadow-sm shadow-indigo-100">
                            Guardar Mesa
                        </button>
                    </form>
                </div>
                <div class="lg:col-span-2 bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
                    <table class="w-full text-left text-sm">
                        <thead class="bg-slate-50/80 text-slate-400 text-xs font-semibold uppercase border-b border-slate-100">
                            <tr>
                                <th class="p-4">Identificador</th>
                                <th class="p-4">Capacidad Registrada</th>
                                <th class="p-4 text-center">Acción</th>
                            </tr>
                        </thead>
                        <tbody id="listaMesas" class="divide-y divide-slate-100">
                            </tbody>
                    </table>
                </div>
            </div>
        </section>

        <section>
            <div class="flex items-center gap-2 mb-4">
                <h2 class="text-xs font-bold text-slate-400 uppercase tracking-widest">Módulo de Reservaciones de Clientes</h2>
                <div class="h-0.5 bg-slate-200 flex-1"></div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                    <h3 class="font-semibold text-sm mb-4 text-slate-700 flex items-center gap-2">
                        <i class="fa-regular fa-calendar-plus text-indigo-600"></i> Agendar Turno
                    </h3>
                    <form id="formReserva" class="space-y-3">
                        <div>
                            <label class="block text-xs font-medium text-slate-500 mb-1">Asignar Mesa Disponible</label>
                            <select id="selectMesa" required class="w-full px-3 py-2 border border-slate-200 bg-slate-50 rounded-lg text-sm focus:outline-none"></select>
                        </div>
                        <div class="grid grid-cols-2 gap-2">
                            <div>
                                <label class="block text-xs font-medium text-slate-500 mb-1">Fecha</label>
                                <input type="date" id="fechaReserva" required class="w-full px-3 py-2 border border-slate-200 bg-slate-50 rounded-lg text-sm focus:outline-none">
                            </div>
                            <div>
                                <label class="block text-xs font-medium text-slate-500 mb-1">Hora</label>
                                <input type="time" id="horaReserva" required class="w-full px-3 py-2 border border-slate-200 bg-
                                <script>
    // Esta es la dirección del túnel SSH que conecta la Mac con el Windows de Karol
    const API_URL = 'http://127.0.0.1:3000/api/mesas';

    // Función mágica para traer las mesas de la base de datos
    async function cargarMesas() {
        try {
            const respuesta = await fetch(API_URL);
            if (!respuesta.ok) throw new Error('Error en el servidor');
            
            const mesas = await respuesta.json();
            console.log('Mesas recibidas de Railway:', mesas);
            
            // Aquí es donde ustedes dibujan las mesas en el HTML.
            // Por ahora, pongamos este aviso para saber si conectó:
            alert('¡Conexión exitosa! El sistema trajo ' + mesas.length + ' mesas.');
            
        } catch (error) {
            console.error('Error al conectar:', error);
            alert('No se pudo conectar al backend de Karol. Revisa que server.js esté encendido.');
        }
    }

    // Ejecutar la función apenas cargue la página
    window.onload = cargarMesas;
</script>
