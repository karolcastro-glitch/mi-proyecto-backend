RESERVA MESA - VERSION PREMIUM
PEGA TODO ESTO EN index.html
============================= -->

<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8" />

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0" />

  <title>Reserva Mesa | Premium</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" />

  <style>

    body{
      font-family:'Segoe UI',sans-serif;
      background:#f5f5f5;
    }

    .hero{
      background:
      linear-gradient(rgba(0,0,0,.7),rgba(0,0,0,.7)),
      url('https://images.unsplash.com/photo-1517248135467-4c7edcad34b4?w=1920')
      center/cover no-repeat;
    }

    .section{
      display:none;
    }

    .section.active{
      display:block;
    }

    .fade{
      animation:fade .3s ease;
    }

    @keyframes fade{
      from{
        opacity:0;
        transform:translateY(20px);
      }

      to{
        opacity:1;
        transform:translateY(0);
      }
    }

    .nav-active{
      color:#b91c1c;
      border-bottom:3px solid #b91c1c;
      font-weight:700;
    }

  </style>

</head>

<body>

<!-- =========================
HEADER
========================= -->

<header class="bg-white shadow sticky top-0 z-50">

  <div class="max-w-7xl mx-auto px-6 py-5 flex justify-between items-center">

    <div class="flex items-center gap-4">

      <div class="bg-red-700 text-white p-4 rounded-2xl">
        <i class="fa-solid fa-utensils text-2xl"></i>
      </div>

      <div>

        <h1 class="text-2xl font-bold">
          Reserva Mesa
        </h1>

        <p class="text-gray-500 text-sm">
          Popayán • Cauca
        </p>

      </div>

    </div>

    <nav class="flex items-center gap-6">

      <button onclick="showSection('home')"
              class="nav-btn nav-active px-3 py-2">
        Restaurantes
      </button>

      <button onclick="showSection('reservations')"
              class="nav-btn px-3 py-2">
        Mis Reservas
      </button>

      <button onclick="showSection('profile')"
              class="nav-btn px-3 py-2">
        Mi Perfil
      </button>

      <div id="authButtons"
           class="flex items-center gap-4">

        <button onclick="showLoginModal()"
                class="border px-5 py-2 rounded-xl">
          Iniciar Sesión
        </button>

        <button onclick="showRegisterModal()"
                class="bg-red-700 text-white px-5 py-2 rounded-xl">
          Registrarse
        </button>

      </div>

      <div id="userMenu"
           class="hidden items-center gap-4">

        <div class="flex items-center gap-3 bg-gray-100 px-4 py-2 rounded-2xl">

          <div class="bg-red-700 text-white w-10 h-10 rounded-full flex items-center justify-center">
            <i class="fa-solid fa-user"></i>
          </div>

          <div>

            <p id="userName"
               class="font-semibold">
            </p>

            <p class="text-xs text-gray-500">
              Usuario activo
            </p>

          </div>

        </div>

        <button onclick="logout()"
                class="bg-black text-white px-4 py-2 rounded-xl">
          Salir
        </button>

      </div>

    </nav>

  </div>

</header>

<!-- =========================
HOME
========================= -->

<section id="home-section"
         class="section active">

  <div class="hero h-[70vh] flex items-center justify-center text-white">

    <div class="text-center">

      <h2 class="text-6xl font-bold mb-6">
        Reserva tu experiencia gastronómica
      </h2>

      <p class="text-xl text-gray-200">
        Descubre los mejores restaurantes premium
      </p>

    </div>

  </div>

  <div class="max-w-7xl mx-auto px-6 py-14">

    <h2 class="text-4xl font-bold mb-10">
      Restaurantes Destacados
    </h2>

    <div id="restaurantsContainer"
         class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
    </div>

  </div>

</section>

<!-- =========================
MIS RESERVAS
========================= -->

<section id="reservations-section"
         class="section max-w-7xl mx-auto px-6 py-14">

  <h2 class="text-4xl font-bold mb-10">
    Mis Reservas
  </h2>

  <div id="reservationsList"
       class="space-y-6">
  </div>

</section>

<!-- =========================
MI PERFIL
========================= -->

<section id="profile-section"
         class="section max-w-5xl mx-auto px-6 py-14">

  <div class="bg-white rounded-3xl shadow-xl p-10">

    <div class="flex items-center gap-6 mb-10">

      <div class="bg-red-700 text-white w-24 h-24 rounded-full flex items-center justify-center text-4xl">

        <i class="fa-solid fa-user"></i>

      </div>

      <div>

        <h2 id="profileName"
            class="text-4xl font-bold">
        </h2>

        <p id="profileEmail"
           class="text-gray-500 mt-2">
        </p>

      </div>

    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

      <div class="bg-gray-100 p-6 rounded-3xl">

        <h3 class="text-xl font-bold mb-3">
          Reservas realizadas
        </h3>

        <p id="profileReservations"
           class="text-5xl font-bold text-red-700">
          0
        </p>

      </div>

      <div class="bg-gray-100 p-6 rounded-3xl">

        <h3 class="text-xl font-bold mb-3">
          Estado de cuenta
        </h3>

        <p class="text-2xl font-bold text-green-600">
          Premium
        </p>

      </div>

    </div>

  </div>

</section>

<!-- =========================
LOGIN MODAL
========================= -->

<div id="loginModal"
     class="hidden fixed inset-0 bg-black/70 z-50 flex items-center justify-center p-4">

  <div class="bg-white rounded-3xl w-full max-w-md p-8 fade">

    <div class="flex justify-between items-center mb-8">

      <h2 class="text-3xl font-bold">
        Iniciar Sesión
      </h2>

      <button onclick="closeModals()"
              class="text-3xl">
        ×
      </button>

    </div>

    <div class="space-y-5">

      <div>

        <label class="font-medium">
          Correo electrónico
        </label>

        <input type="email"
               id="loginEmail"
               class="w-full border rounded-2xl px-5 py-4 mt-2">

      </div>

      <div>

        <label class="font-medium">
          Contraseña
        </label>

        <input type="password"
               id="loginPassword"
               class="w-full border rounded-2xl px-5 py-4 mt-2">

      </div>

      <button onclick="login()"
              class="w-full bg-red-700 hover:bg-red-800 text-white py-4 rounded-2xl text-lg font-semibold">

        Entrar

      </button>

    </div>

  </div>

</div>

<!-- =========================
REGISTER MODAL
========================= -->

<div id="registerModal"
     class="hidden fixed inset-0 bg-black/70 z-50 flex items-center justify-center p-4">

  <div class="bg-white rounded-3xl w-full max-w-md p-8 fade">

    <div class="flex justify-between items-center mb-8">

      <h2 class="text-3xl font-bold">
        Crear Cuenta
      </h2>

      <button onclick="closeModals()"
              class="text-3xl">
        ×
      </button>

    </div>

    <div class="space-y-5">

      <div>

        <label class="font-medium">
          Nombre completo
        </label>

        <input type="text"
               id="registerName"
               class="w-full border rounded-2xl px-5 py-4 mt-2">

      </div>

      <div>

        <label class="font-medium">
          Correo electrónico
        </label>

        <input type="email"
               id="registerEmail"
               class="w-full border rounded-2xl px-5 py-4 mt-2">

      </div>

      <div>

        <label class="font-medium">
          Contraseña
        </label>

        <input type="password"
               id="registerPassword"
               class="w-full border rounded-2xl px-5 py-4 mt-2">

      </div>

      <button onclick="register()"
              class="w-full bg-red-700 hover:bg-red-800 text-white py-4 rounded-2xl text-lg font-semibold">

        Registrarse

      </button>

    </div>

  </div>

</div>

<script>

let currentUser =
JSON.parse(localStorage.getItem('currentUser')) || null;

let reservations =
JSON.parse(localStorage.getItem('reservations')) || [];

const restaurants = [

{
  id:1,
  name:"Mora de Castilla",
  cuisine:"Tradicional Caucana",
  rating:4.8,
  price:"$$",
  image:"https://images.unsplash.com/photo-1552566626-52f8b828add9?w=1200"
},

{
  id:2,
  name:"La Viña",
  cuisine:"Colombiana Moderna",
  rating:4.7,
  price:"$$$",
  image:"https://images.unsplash.com/photo-1514933651103-005eec06c04b?w=1200"
},

{
  id:3,
  name:"Tequendama",
  cuisine:"Típica Payanesa",
  rating:4.9,
  price:"$$",
  image:"https://images.unsplash.com/photo-1559339352-11d035aa65de?w=1200"
},

{
  id:4,
  name:"Bistro Gourmet",
  cuisine:"Internacional",
  rating:4.9,
  price:"$$$$",
  image:"https://images.unsplash.com/photo-1541544181051-e46607dffdf5?w=1200"
},

{
  id:5,
  name:"Sabor Andino",
  cuisine:"Comida Andina",
  rating:4.5,
  price:"$$",
  image:"https://images.unsplash.com/photo-1504674900247-0877df9cc836?w=1200"
},

{
  id:6,
  name:"Casa Payanesa",
  cuisine:"Cocina Colonial",
  rating:4.7,
  price:"$$$",
  image:"https://images.unsplash.com/photo-1414235077428-338989a2e8c0?w=1200"
}

];

function renderRestaurants(){

  const container =
  document.getElementById('restaurantsContainer');

  container.innerHTML = restaurants.map(r=>`

    <div class="bg-white rounded-3xl overflow-hidden shadow-xl hover:scale-105 transition duration-300">

      <img src="${r.image}"
           class="w-full h-64 object-cover">

      <div class="p-6">

        <div class="flex justify-between">

          <div>

            <h3 class="text-2xl font-bold">
              ${r.name}
            </h3>

            <p class="text-gray-500 mt-1">
              ${r.cuisine}
            </p>

          </div>

          <span class="bg-yellow-100 text-yellow-700 px-3 py-1 rounded-full h-fit">
            ★ ${r.rating}
          </span>

        </div>

        <div class="flex justify-between items-center mt-8">

          <span class="font-bold text-lg">
            ${r.price}
          </span>

          <button onclick="openReservation(${r.id})"
                  class="bg-red-700 hover:bg-red-800 text-white px-5 py-3 rounded-2xl">

            Reservar

          </button>

        </div>

      </div>

    </div>

  `).join('');

}

function openReservation(id){

  if(!currentUser){

    showToast('Debes iniciar sesión primero',true);

    showLoginModal();

    return;

  }

  const r = restaurants.find(x=>x.id===id);

  document.body.insertAdjacentHTML('beforeend',`

  <div id="reservationModal"
       class="fixed inset-0 bg-black/70 z-50 flex items-center justify-center p-4">

    <div class="bg-white rounded-3xl w-full max-w-xl p-8 fade">

      <div class="flex justify-between items-center mb-8">

        <div>

          <h2 class="text-3xl font-bold">
            Reservar Mesa
          </h2>

          <p class="text-gray-500 mt-1">
            ${r.name}
          </p>

        </div>

        <button onclick="closeReservationModal()"
                class="text-3xl">
          ×
        </button>

      </div>

      <div class="space-y-5">

        <div>

          <label class="font-medium">
            Fecha de reserva
          </label>

          <input type="date"
                 id="reservationDate"
                 class="w-full border rounded-2xl px-5 py-4 mt-2">

        </div>

        <div>

          <label class="font-medium">
            Hora de reserva
          </label>

          <input type="time"
                 id="reservationTime"
                 class="w-full border rounded-2xl px-5 py-4 mt-2">

        </div>

        <div>

          <label class="font-medium">
            Mesa para cuántas personas
          </label>

          <input type="number"
                 id="reservationGuests"
                 min="1"
                 value="2"
                 class="w-full border rounded-2xl px-5 py-4 mt-2">

        </div>

        <div>

          <label class="font-medium">
            Zona del restaurante
          </label>

          <select id="reservationZone"
                  class="w-full border rounded-2xl px-5 py-4 mt-2">

            <option>Zona VIP</option>
            <option>Terraza</option>
            <option>Interior</option>
            <option>Ventana</option>

          </select>

        </div>

        <div>

          <label class="font-medium">
            Comentarios adicionales
          </label>

          <textarea id="reservationComment"
                    class="w-full border rounded-2xl px-5 py-4 mt-2 h-32"
                    placeholder="Cumpleaños, decoración especial, etc"></textarea>

        </div>

        <button onclick="confirmReservation(${r.id})"
                class="w-full bg-red-700 hover:bg-red-800 text-white py-4 rounded-2xl text-lg font-semibold">

          Confirmar Reserva

        </button>

      </div>

    </div>

  </div>

  `);

}

function closeReservationModal(){

  document.getElementById('reservationModal').remove();

}

function confirmReservation(id){

  const r = restaurants.find(x=>x.id===id);

  reservations.push({

    id:Date.now(),

    restaurant:r.name,

    date:document.getElementById('reservationDate').value,

    time:document.getElementById('reservationTime').value,

    guests:document.getElementById('reservationGuests').value,

    zone:document.getElementById('reservationZone').value,

    comment:document.getElementById('reservationComment').value,

    status:'Confirmada'

  });

  localStorage.setItem(
    'reservations',
    JSON.stringify(reservations)
  );

  closeReservationModal();

  renderReservations();

  updateProfile();

  showToast('Reserva realizada exitosamente');

}

function renderReservations(){

  const container =
  document.getElementById('reservationsList');

  if(reservations.length===0){

    container.innerHTML = `

    <div class="bg-white p-16 rounded-3xl text-center shadow-xl">

      <div class="text-7xl mb-6">
        🍽️
      </div>

      <h3 class="text-3xl font-bold mb-3">
        No tienes reservas
      </h3>

      <p class="text-gray-500">
        Tus reservas aparecerán aquí
      </p>

    </div>

    `;

    return;

  }

  container.innerHTML = reservations.map(r=>`

    <div class="bg-white rounded-3xl shadow-xl p-8">

      <div class="flex justify-between items-center">

        <div>

          <h3 class="text-2xl font-bold">
            ${r.restaurant}
          </h3>

          <p class="text-gray-500 mt-2">
            ${r.date} • ${r.time}
          </p>

        </div>

        <span class="bg-green-100 text-green-700 px-5 py-2 rounded-full">
          ${r.status}
        </span>

      </div>

      <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mt-8">

        <div class="bg-gray-100 p-5 rounded-2xl">
          👥 ${r.guests} personas
        </div>

        <div class="bg-gray-100 p-5 rounded-2xl">
          📍 ${r.zone}
        </div>

        <div class="bg-gray-100 p-5 rounded-2xl">
          🍷 Premium
        </div>

        <div class="bg-gray-100 p-5 rounded-2xl">
          ⭐ VIP
        </div>

      </div>

      <div class="bg-gray-50 p-5 rounded-2xl mt-5 text-gray-600">

        ${r.comment || 'Sin comentarios'}

      </div>

    </div>

  `).join('');

}

function showSection(section){

  document.querySelectorAll('.section')
  .forEach(s=>s.classList.remove('active'));

  document.getElementById(section+'-section')
  .classList.add('active');

  document.querySelectorAll('.nav-btn')
  .forEach(btn=>btn.classList.remove('nav-active'));

  if(section==='home'){
    document.querySelectorAll('.nav-btn')[0].classList.add('nav-active');
  }

  if(section==='reservations'){
    document.querySelectorAll('.nav-btn')[1].classList.add('nav-active');
  }

  if(section==='profile'){
    document.querySelectorAll('.nav-btn')[2].classList.add('nav-active');
  }

}

function showLoginModal(){

  document.getElementById('loginModal')
  .classList.remove('hidden');

}

function showRegisterModal(){

  document.getElementById('registerModal')
  .classList.remove('hidden');

}

function closeModals(){

  document.getElementById('loginModal')
  .classList.add('hidden');

  document.getElementById('registerModal')
  .classList.add('hidden');

}

function login(){

  const email =
  document.getElementById('loginEmail').value;

  const pass =
  document.getElementById('loginPassword').value;

  if(email && pass){

    currentUser = {

      name:'Usuario Premium',

      email

    };

    localStorage.setItem(
      'currentUser',
      JSON.stringify(currentUser)
    );

    updateUserUI();

    closeModals();

    showToast('Inicio de sesión exitoso');

  }

}

function register(){

  const name =
  document.getElementById('registerName').value;

  const email =
  document.getElementById('registerEmail').value;

  const pass =
  document.getElementById('registerPassword').value;

  if(name && email && pass){

    currentUser = {
      name,
      email
    };

    localStorage.setItem(
      'currentUser',
      JSON.stringify(currentUser)
    );

    updateUserUI();

    closeModals();

    showToast('Cuenta creada exitosamente');

  }

}

function logout(){

  localStorage.removeItem('currentUser');

  currentUser = null;

  updateUserUI();

  showToast('Sesión cerrada');

}

function updateUserUI(){

  if(currentUser){

    document.getElementById('authButtons')
    .classList.add('hidden');

    document.getElementById('userMenu')
    .classList.remove('hidden');

    document.getElementById('userMenu')
    .classList.add('flex');

    document.getElementById('userName')
    .innerText = currentUser.name;

    document.getElementById('profileName')
    .innerText = currentUser.name;

    document.getElementById('profileEmail')
    .innerText = currentUser.email;

  }else{

    document.getElementById('authButtons')
    .classList.remove('hidden');

    document.getElementById('userMenu')
    .classList.add('hidden');

  }

  updateProfile();

}

function updateProfile(){

  document.getElementById('profileReservations')
  .innerText = reservations.length;

}

function showToast(message,error=false){

  const toast =
  document.createElement('div');

  toast.className = `
    fixed
    top-5
    right-5
    px-6
    py-4
    rounded-2xl
    text-white
    z-50
    shadow-2xl
    ${error ? 'bg-red-600' : 'bg-green-600'}
  `;

  toast.innerHTML = `
    <div class="flex items-center gap-3">
      <span class="text-2xl">
        ${error ? '❌' : '✅'}
      </span>
      <span>${message}</span>
    </div>
  `;

  document.body.appendChild(toast);

  setTimeout(()=>{
    toast.remove();
  },3000);

}

window.onload = ()=>{

  renderRestaurants();

  renderReservations();

  updateUserUI();

};

</script>

</body>
</html>
