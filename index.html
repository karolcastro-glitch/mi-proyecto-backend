<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reserva Mesa | Popayán</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <style>
    body { font-family: 'Segoe UI', system-ui, sans-serif; }
    .hero {
      background: linear-gradient(rgba(0,0,0,0.75), rgba(0,0,0,0.75)), 
                  url('https://images.unsplash.com/photo-1517248135467-4c7edcad34b4?w=1920') center/cover no-repeat;
    }
    .nav-active { border-bottom: 3px solid #9f1239; font-weight: 600; }
  </style>
</head>
<body class="bg-gray-50">

  <!-- HEADER -->
  <header class="bg-white shadow-sm sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-6 py-5 flex justify-between items-center">
      <div class="flex items-center gap-3">
        <div class="bg-red-700 text-white p-3 rounded-2xl">
          <i class="fa-solid fa-utensils text-2xl"></i>
        </div>
        <div>
          <h1 class="text-2xl font-bold">Reserva Mesa</h1>
          <p class="text-xs text-gray-500 -mt-1">Popayán • Cauca</p>
        </div>
      </div>

      <nav class="flex items-center gap-8">
        <button onclick="showSection('home')" class="nav-link nav-active px-4 py-2">Restaurantes</button>
        <button onclick="showSection('reservations')" class="nav-link px-4 py-2">Mis Reservas</button>
        <button onclick="showLoginModal()" class="px-6 py-2.5 border border-gray-300 rounded-xl hover:bg-gray-50">Iniciar Sesión</button>
        <button onclick="showRegisterModal()" class="px-6 py-2.5 bg-red-700 text-white rounded-xl hover:bg-red-800">Registrarse</button>
      </nav>
    </div>
  </header>

  <!-- HOME SECTION -->
  <section id="home-section" class="section">
    <div class="hero h-[70vh] flex items-center text-white">
      <div class="max-w-4xl mx-auto px-6 text-center">
        <h2 class="text-5xl md:text-6xl font-bold mb-6">Encuentra y reserva tu mesa favorita</h2>
        <p class="text-xl mb-10">Los mejores restaurantes de Popayán te esperan</p>
      </div>
    </div>

    <div class="max-w-7xl mx-auto px-6 py-12">
      <h2 class="text-3xl font-bold mb-8">Restaurantes Disponibles</h2>
      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8" id="restaurantsContainer"></div>
    </div>
  </section>

  <!-- MIS RESERVAS SECTION -->
  <section id="reservations-section" class="section hidden max-w-7xl mx-auto px-6 py-12">
    <h2 class="text-3xl font-bold mb-8">Mis Reservas</h2>
    <div id="reservationsList" class="space-y-6">
      <!-- Se llena con JavaScript -->
    </div>
  </section>

  <!-- LOGIN MODAL -->
  <div id="loginModal" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center z-50">
    <div class="bg-white rounded-3xl p-8 max-w-md w-full mx-4">
      <h3 class="text-2xl font-bold mb-6">Iniciar Sesión</h3>
      <input type="email" id="loginEmail" placeholder="Correo electrónico" class="w-full border rounded-xl px-4 py-3 mb-4">
      <input type="password" id="loginPassword" placeholder="Contraseña" class="w-full border rounded-xl px-4 py-3 mb-6">
      <button onclick="login()" class="w-full bg-red-700 text-white py-4 rounded-2xl font-medium">Entrar</button>
      <p class="text-center text-sm text-gray-500 mt-4">Usuario prueba: admin@reservamesa.com / admin123</p>
      <button onclick="closeModals()" class="mt-6 w-full text-gray-500">Cerrar</button>
    </div>
  </div>

  <script>
    // Datos de ejemplo
    let reservations = [];

    const restaurants = [
      { id: 1, name: "Mora de Castilla", cuisine: "Tradicional Caucana", rating: 4.8, price: "$$", image: "https://picsum.photos/id/1015/600/400" },
      { id: 2, name: "La Viña", cuisine: "Colombiana Moderna", rating: 4.7, price: "$$$", image: "https://picsum.photos/id/106/600/400" },
      { id: 3, name: "Tequendama", cuisine: "Típica Payanesa", rating: 4.6, price: "$", image: "https://picsum.photos/id/201/600/400" }
    ];

    function renderRestaurants() {
      const container = document.getElementById('restaurantsContainer');
      container.innerHTML = restaurants.map(r => `
        <div class="bg-white rounded-3xl overflow-hidden shadow-lg hover:shadow-2xl transition-all">
          <img src="${r.image}" class="w-full h-48 object-cover">
          <div class="p-6">
            <h3 class="text-xl font-semibold">${r.name}</h3>
            <p class="text-gray-600">${r.cuisine}</p>
            <div class="flex justify-between items-center mt-4">
              <span class="text-yellow-500">★ ${r.rating}</span>
              <span class="font-medium">${r.price}</span>
            </div>
            <button onclick="reserveRestaurant(${r.id})" 
                    class="mt-6 w-full bg-red-700 text-white py-3.5 rounded-2xl hover:bg-red-800">
              Reservar Mesa
            </button>
          </div>
        </div>
      `).join('');
    }

    function reserveRestaurant(id) {
      const restaurant = restaurants.find(r => r.id === id);
      const date = prompt("Ingrese la fecha (YYYY-MM-DD):", "2026-05-30");
      if (date) {
        reservations.push({
          id: Date.now(),
          restaurant: restaurant.name,
          date: date,
          time: "20:00",
          guests: 4,
          status: "Confirmada"
        });
        alert(`✅ Reserva realizada en ${restaurant.name}`);
        showSection('reservations');
      }
    }

    function renderReservations() {
      const container = document.getElementById('reservationsList');
      if (reservations.length === 0) {
        container.innerHTML = `<p class="text-center text-gray-500 py-12">Aún no tienes reservas</p>`;
        return;
      }
      container.innerHTML = reservations.map(r => `
        <div class="bg-white p-6 rounded-3xl shadow">
          <div class="flex justify-between">
            <h3 class="font-semibold">${r.restaurant}</h3>
            <span class="text-green-600">${r.status}</span>
          </div>
          <p class="text-gray-600">Fecha: ${r.date} | Hora: ${r.time} | ${r.guests} personas</p>
        </div>
      `).join('');
    }

    function showSection(section) {
      document.querySelectorAll('.section').forEach(s => s.classList.add('hidden'));
      document.getElementById(section + '-section').classList.remove('hidden');
      
      if (section === 'reservations') renderReservations();
    }

    function showLoginModal() {
      document.getElementById('loginModal').classList.remove('hidden');
    }

    function closeModals() {
      document.getElementById('loginModal').classList.add('hidden');
    }

    function login() {
      const email = document.getElementById('loginEmail').value;
      const pass = document.getElementById('loginPassword').value;
      
      if (email && pass) {
        alert("✅ Inicio de sesión exitoso (simulado)");
        closeModals();
      } else {
        alert("Por favor ingresa tus datos");
      }
    }

    function showRegisterModal() {
      alert("Registro de usuario en desarrollo.\n\nPuedes usar la cuenta de prueba:\nadmin@reservamesa.com / admin123");
    }

    // Inicializar
    window.onload = () => {
      renderRestaurants();
      showSection('home');
    };
  </script>
</body>
</html>
